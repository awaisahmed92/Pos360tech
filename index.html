<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="POS360tech — retail checkout, inventory, and sales. Work in progress." />
  <title>POS360tech — Coming Soon</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f766e'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='Arial' font-size='16' font-weight='700' fill='white'%3EP%3C/text%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #071614;
      --card: rgba(15, 32, 30, 0.86);
      --line: rgba(20, 184, 166, 0.28);
      --text: #f4fbfa;
      --muted: #9bb8b4;
      --accent: #14b8a6;
      --accent-2: #2dd4bf;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(900px 480px at 15% -10%, rgba(20, 184, 166, 0.28), transparent 60%),
        radial-gradient(700px 420px at 100% 100%, rgba(13, 148, 136, 0.22), transparent 55%),
        var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }

    .wrap {
      width: min(720px, 100%);
      text-align: center;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .mark {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #0d9488, #14b8a6);
      font-size: 16px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 48px 36px 40px;
      backdrop-filter: blur(10px);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.28);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(20, 184, 166, 0.1);
      color: var(--accent-2);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 0 rgba(20, 184, 166, 0.7);
      animation: pulse 1.8s infinite;
    }

    h1 {
      margin: 22px 0 12px;
      font-size: clamp(2.2rem, 6vw, 3.4rem);
      letter-spacing: -0.04em;
      line-height: 1.05;
    }

    h1 span { color: var(--accent-2); }

    p.lead {
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.6;
      max-width: 460px;
      margin: 0 auto 28px;
    }

    .bar {
      height: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
      max-width: 280px;
      margin: 0 auto 10px;
    }

    .bar > span {
      display: block;
      height: 100%;
      width: 42%;
      border-radius: inherit;
      background: linear-gradient(90deg, #0d9488, #5eead4);
    }

    .status {
      color: var(--muted);
      font-size: 0.85rem;
      margin-bottom: 28px;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .chips span {
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.04);
      color: #d7efe9;
      font-size: 0.85rem;
    }

    footer {
      margin-top: 22px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    footer a {
      color: var(--accent-2);
      text-decoration: none;
      font-weight: 600;
    }

    footer a:hover { text-decoration: underline; }

    @keyframes pulse {
      70% { box-shadow: 0 0 0 8px rgba(20, 184, 166, 0); }
      100% { box-shadow: 0 0 0 0 rgba(20, 184, 166, 0); }
    }

    @media (max-width: 540px) {
      .card { padding: 36px 20px 28px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="brand">
      <div class="mark">P</div>
      POS360tech
    </div>

    <section class="card">
      <div class="badge"><span class="dot"></span> Work in progress</div>
      <h1>Coming <span>soon</span></h1>
      <p class="lead">Retail checkout, inventory, and sales in one place. We are building POS360tech and it will be live shortly.</p>
      <div class="bar" aria-hidden="true"><span></span></div>
      <p class="status">Building checkout, stock, and reports</p>
      <div class="chips">
        <span>Point of sale</span>
        <span>Inventory</span>
        <span>Sales reports</span>
      </div>
    </section>

    <footer>
      A product of <a href="https://360techx.com">360techx</a>
      · <a href="mailto:contact@360techx.com">contact@360techx.com</a>
    </footer>
  </main>
</body>
</html>
