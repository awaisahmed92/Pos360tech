<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Point of sale — checkout, receipts, and stock for shops and branches">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://pos360techx.com/">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://pos360techx.com/">
  <meta property="og:title" content="POS360tech">
  <meta property="og:description" content="Point of sale — checkout, receipts, and stock for shops and branches">
  <meta property="og:image" content="https://pos360techx.com/logo-mark.svg">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="POS360tech">
  <meta name="twitter:description" content="Point of sale — checkout, receipts, and stock for shops and branches">
  <meta name="twitter:image" content="https://pos360techx.com/logo-mark.svg">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="pos360tech">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="logo-mark.svg"/>

  <title>POS360tech</title>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "POS360tech",
    "applicationCategory": "BusinessApplication",
    "operatingSystem": "Web",
    "url": "https://pos360techx.com/",
    "description": "Point of sale — checkout, receipts, and stock for shops and branches"
  }
  </script>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #f3f7f6; font-family: "Segoe UI", sans-serif; }
    #boot-login { position: fixed; inset: 0; display: flex; background: linear-gradient(135deg, #f3f7f6, #fff); }
    #boot-login .pane { flex: 0 0 38%; display: flex; align-items: center; justify-content: center; padding: 24px; }
    #boot-login .card { width: min(520px, 100%); background: #fff; border-radius: 20px; border: 1px solid #e6e8ee; box-shadow: 0 8px 24px rgba(20,24,31,.08); padding: 28px; }
    #boot-login .brand { font-size: 32px; font-weight: 700; color: #1f2937; margin-bottom: 26px; }
    #boot-login h1 { margin: 0; font-size: 30px; }
    #boot-login .sub { margin: 4px 0 0; color: #6b7280; }
    #boot-login .hero { flex: 1; background: #fff; display: flex; align-items: center; justify-content: center; text-align: center; padding: 36px; }
    #boot-login .hero h2 { margin: 0; font-size: 48px; line-height: 1.15; color: #1f2937; }
    @media (max-width: 979px) { #boot-login .hero { display: none; } #boot-login .pane { flex: 1; } }
  </style>
</head>
<body>
  <div id="boot-login">
    <div class="pane">
      <div class="card">
        <div class="brand">POS360tech</div>
        <h1>Welcome Back</h1>
        <p class="sub">Sign in to continue</p>
      </div>
    </div>
    <aside class="hero"><h2>Sales, stock,<br>and the counter<br>made simple</h2></aside>
  </div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    var observer = new MutationObserver(function () {
      if (document.querySelector('flt-glass-pane, flutter-view, flt-scene-host')) {
        var el = document.getElementById('boot-login');
        if (el) el.remove();
        observer.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });
  </script>
</body>
</html>
