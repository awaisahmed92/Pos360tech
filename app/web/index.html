<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="pos360tech">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="logo-mark.svg"/>

  <title>POS360tech</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #F4F7F6; }
    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      font-family: "Segoe UI", sans-serif;
      color: #134E4A;
    }
    #boot .mark {
      width: 56px;
      height: 56px;
      display: block;
      object-fit: contain;
    }
    #boot .name { font-weight: 700; font-size: 18px; }
    #boot .bar {
      width: 148px;
      height: 3px;
      border-radius: 99px;
      background: #D7E4E2;
      overflow: hidden;
    }
    #boot .bar span {
      display: block;
      height: 100%;
      width: 40%;
      background: #0F766E;
      animation: boot 1.1s ease-in-out infinite;
    }
    @keyframes boot {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(320%); }
    }
  </style>
</head>
<body>
  <div id="boot">
    <img class="mark" src="logo-mark.svg" alt="">
    <div class="name">POS360tech</div>
    <div class="bar"><span></span></div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
